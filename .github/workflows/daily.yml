name: 竞彩概率分析（分时段更新 + 每日数据回馈）

on:
  # push 触发：代码/UI 改动 push 到 main 后立即重新部署（保证线上与本地同步）
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "docs/**"
      - "data/**"
  schedule:
    # 分时段频率（均为 UTC，需 -8 换算北京时间）：
    #   比赛时段（北京时间 12:00 ~ 次日 02:00 = UTC 04:00 ~ 18:00）：每 10 分钟
    #   非赛时段（北京时间 02:00 ~ 11:00 = UTC 18:00 ~ 03:00）：每 1 小时（整点）
    #   cron 用 UTC 表示：
    #     - "*/10 4-17 * * *"  = UTC 04:00~17:50 每10分钟（北京 12:00~次日01:50）
    #     - "0 18-23,0-2 * * *" = UTC 18:00~02:00 每小时（北京 02:00~10:00）
    #   UTC 03:00（北京 11:00）专属「每日数据回馈」档，不与上面的每小时档重叠：
    - cron: "*/10 4-17 * * *"
    - cron: "0 18-23,0-2 * * *"
    # 每日数据回馈闭环：北京时间 11:00（UTC 03:00），前一比赛日赛果归档 + 回测
    - cron: "0 3 * * *"
  workflow_dispatch:  # 手动触发（也会执行完整更新）

permissions:
  contents: write
  pages: write
  id-token: write

# 同一分支同一 workflow 串行执行，避免多个定时档位/手动触发并行 push 导致冲突
concurrency:
  group: jingcai-football-main
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: 运行每日流水线
        run: |
          python -m src.pipeline

      - name: 结算昨日与今日已完赛场次
        run: |
          python -m src.backtest.settle || echo "结算跳过（可能无赛果数据）"

      - name: 重新渲染页面（含命中率统计）
        run: |
          python -m src.output.render || echo "渲染跳过"

      - name: Commit 结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          git commit -m "chore: 更新 $(date +%Y%m%d) 预测与结算数据" || echo "无变更"
          git pull origin main --rebase && git push

  daily-feedback:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: 每日数据回馈闭环（每天 UTC 03:00 档执行，其余档位跳过）
        run: |
          # 用「当前时间是否落在 UTC 03:00~03:59 这一档」判断是否执行每日回馈，
          # 取代之前脆弱的「分钟 < 30」窗口（调度延迟 + analyze 前置耗时会导致漏执行）。
          # 注意：用 10# 前缀强制十进制，避免 bash 把 08/09 当八进制解析报错。
          HOUR_UTC=$(date -u +%H)
          if [ "$HOUR_UTC" = "03" ]; then
            echo "→ UTC 03:00 档（北京时间 11:00），执行每日数据回馈闭环"
            python -m src.backtest.daily_feedback || echo "⚠️ 每日回馈执行异常（不影响后续部署）"
          else
            echo "→ 非 UTC 03:00 档（当前 UTC ${HOUR_UTC} 点），跳过每日回馈"
          fi

      - name: Commit 回馈结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/feedback.html
          git commit -m "chore: 每日数据回馈 $(date +%Y%m%d)（赛果归档+回测）" || echo "无变更"
          git pull origin main --rebase && git push

  deploy:
    needs: [analyze, daily-feedback]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 拉取 analyze 刚推送的最新数据与页面
        run: |
          # analyze job 会重新生成 docs/ 并 push 回 main，这里拉取最新，
          # 避免 deploy 部署到「触发时的旧 commit」导致线上与本地不同步。
          git pull --ff-only origin main || echo "无新提交，使用当前 checkout"

      - name: Deploy to GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
